name: govulncheck
description: >-
  Scan reachable Go vulnerabilities with the govulncheck version pinned in tools/go.mod.
  Requires Go on PATH (actions/setup-go). GOOS, GOARCH and GOFLAGS from the caller apply to the scan,
  not to the tool installation.
inputs:
  working-directory:
    description: Go module directory to scan.
    default: .
  packages:
    description: Space-separated package patterns.
    default: ./...
  report:
    description: >-
      "true" writes a normalized JSON report and uploads it as an artifact for security-issues-sync.
      The step still fails when reachable vulnerabilities are found.
    default: "false"
  artifact-name:
    description: Artifact name used when report is "true".
    default: security-report-govulncheck
outputs:
  report-path:
    description: Path of the JSON report when report is "true".
    value: ${{ steps.scan.outputs.report-path }}
runs:
  using: composite
  steps:
    - name: Install pinned govulncheck
      id: install
      shell: bash
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/ci-actions-bin"
        cd "$GITHUB_ACTION_PATH/../tools"
        # Build for the runner, whatever target the caller selected for the scan.
        env -u GOOS -u GOARCH -u GOARM -u GOFLAGS GOBIN="$bin" go install golang.org/x/vuln/cmd/govulncheck
        echo "path=$bin/govulncheck" >> "$GITHUB_OUTPUT"

    - name: Scan reachable vulnerabilities
      id: scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GOVULNCHECK: ${{ steps.install.outputs.path }}
        PACKAGES: ${{ inputs.packages }}
        REPORT: ${{ inputs.report }}
      run: |
        set -euo pipefail
        read -ra packages <<< "$PACKAGES"
        if [[ "$REPORT" != true ]]; then
          exec "$GOVULNCHECK" "${packages[@]}"
        fi
        raw="$RUNNER_TEMP/govulncheck.jsonl"
        report="$RUNNER_TEMP/govulncheck-report.json"
        echo "report-path=$report" >> "$GITHUB_OUTPUT"
        set +e
        "$GOVULNCHECK" -json "${packages[@]}" > "$raw"
        status=$?
        set -e
        python3 -I "$GITHUB_ACTION_PATH/../lib/security_reports.py" govulncheck "$raw" "$report" "$status"

    - name: Store report
      if: always() && inputs.report == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/govulncheck-report.json
        if-no-files-found: ignore
        retention-days: 1
