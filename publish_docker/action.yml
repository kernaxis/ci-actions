name: Publish Docker Image
description: >-
  Push locally built images with skopeo, skipping tags whose remote digest already matches.
  Inputs reach the shell only through environment variables, and credentials only through
  a temporary auth file.
inputs:
  username:
    description: Registry username.
    required: true
  password:
    description: Registry password or token.
    required: true
  tags:
    description: Newline-separated image references present in the local Docker daemon.
    required: true

runs:
  using: composite
  steps:
    - name: Ensure skopeo and jq
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v skopeo >/dev/null || ! command -v jq >/dev/null; then
          sudo apt-get update && sudo apt-get install -y skopeo jq
        fi

    - name: Push Docker image if digest changed
      shell: bash
      env:
        REGISTRY_USERNAME: ${{ inputs.username }}
        REGISTRY_PASSWORD: ${{ inputs.password }}
        TAGS: ${{ inputs.tags }}
      run: |
        set -euo pipefail
        workdir=$(mktemp -d "$RUNNER_TEMP/publish-docker.XXXXXX")
        trap 'rm -rf "$workdir"' EXIT
        authfile="$workdir/auth.json"

        registry_of() {
          local first=${1%%/*}
          if [[ "$1" == */* && ( "$first" == *.* || "$first" == *:* || "$first" == localhost ) ]]; then
            echo "$first"
          else
            echo docker.io
          fi
        }

        declare -A logged_in=()
        while IFS= read -r tag; do
          tag=${tag//[[:space:]]/}
          [[ -z "$tag" ]] && continue
          registry=$(registry_of "$tag")
          if [[ -z "${logged_in[$registry]:-}" ]]; then
            printf '%s' "$REGISTRY_PASSWORD" |
              skopeo login --authfile "$authfile" --username "$REGISTRY_USERNAME" --password-stdin "$registry" >/dev/null
            logged_in[$registry]=1
          fi

          echo "Checking image digest for tag: $tag"
          archive="$workdir/image-$(tr '/:' '__' <<< "$tag").tar"
          docker save "$tag" -o "$archive"

          built=$(skopeo inspect "docker-archive:$archive" | jq -r '.Digest' || true)
          existing=$(skopeo inspect --authfile "$authfile" "docker://$tag" 2>/dev/null | jq -r '.Digest' || true)
          echo "Local:  $built"
          echo "Remote: ${existing:-<none>}"

          if [[ -n "$built" && "$built" == "$existing" ]]; then
            echo "No changes - skipping push for $tag"
          else
            echo "Digest mismatch - pushing image for $tag"
            skopeo copy --authfile "$authfile" --preserve-digests "docker-archive:$archive" "docker://$tag"
          fi
          rm -f "$archive"
        done <<< "$TAGS"
